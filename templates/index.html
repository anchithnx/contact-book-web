{% extends "base.html" %}

{% block content %}
<h2 class="mb-4">All Contacts</h2>

<form method="get" class="mb-3">
    <input type="text" name="q" class="form-control" placeholder="Search contacts..." value="{{ query }}">
</form>

<table class="table table-bordered table-hover">
    <thead class="table-dark">
        <tr>
            <th>Name</th><th>Phone</th><th>Email</th><th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for contact in contacts %}
        <tr>
            <td>{{ contact.name }}</td>
            <td>{{ contact.phone }}</td>
            <td>{{ contact.email }}</td>
            <td>
                <a href="{{ url_for('edit_contact', index=loop.index0) }}" class="btn btn-sm btn-warning">Edit</a>
                <a href="{{ url_for('delete_contact', index=loop.index0) }}" class="btn btn-sm btn-danger">Delete</a>
            </td>
        </tr>
        {% else %}
        <tr><td colspan="4" class="text-center">No contacts found.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
