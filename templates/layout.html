<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-image: url("{{ url_for('static', filename='images/background.jpg') }}");
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .content-box {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 30px;
            margin: 30px auto;
            width: 90%;
            max-width: 900px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <div class="container py-4 content-box">
        <h2 class="text-center mb-4">Contact Book</h2>
        <nav>
            <ul class="nav justify-content-center mb-4">
                {% if 'username' not in session %}
                    <li class="nav-item"><a href="{{ url_for('login') }}" class="nav-link">Login</a></li>
                    <li class="nav-item"><a href="{{ url_for('register') }}" class="nav-link">Register</a></li>
                {% else %}
                    <li class="nav-item"><a href="{{ url_for('home') }}" class="nav-link">Dashboard</a></li>
                    <li class="nav-item"><a href="{{ url_for('logout') }}" class="nav-link">Logout</a></li>
                {% endif %}
            </ul>
        </nav>

        {% block content %}{% endblock %}
    </div>
</body>
</html>
