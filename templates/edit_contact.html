<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
    <h2>Edit Contact</h2>
    <form method="POST">
        <input class="form-control mb-2" name="name" value="{{ contact.name }}" required>
        <input class="form-control mb-2" name="phone" value="{{ contact.phone }}" required>
        <input class="form-control mb-2" name="email" value="{{ contact.email }}" required>
        <button class="btn btn-warning">Update</button>
        <a class="btn btn-secondary" href="{{ url_for('index') }}">Cancel</a>
    </form>
</body>
</html>
